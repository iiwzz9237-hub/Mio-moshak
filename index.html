<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050713">
<title>Rocket Live</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
import {
  getAuth,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";
import {
  getDatabase,
  ref,
  onValue,
  set,
  update,
  runTransaction,
  onDisconnect
} from "https://www.gstatic.com/firebasejs/11.2.0/firebase-database.js";

/*
  اطلاعات پروژه Firebase خودت را وارد کن.
  در Firebase باید Anonymous Authentication و Realtime Database فعال باشند.

  این نسخه فقط یک نمونه HTML است. برای جلوگیری واقعی از تقلب، اعتبارسنجی
  initData تلگرام، زمان برداشت و ضریب انفجار باید روی سرور انجام شود.
*/
const FIREBASE_CONFIG = {
  apiKey: "YOUR_FIREBASE_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_FIREBASE_APP_ID"
};

const ROOM_ID = "global-room";
const WAITING_LIMIT = 30000;
const NEXT_ROUND_DELAY = 6000;

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getDatabase(app);

const $ = id => document.getElementById(id);
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
  tg.disableVerticalSwipes?.();
  tg.setHeaderColor?.("#050713");
  tg.setBackgroundColor?.("#050713");
}

const fa = value => String(value)
  .replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d])
  .replace(".", "٫");

const formatMultiplier = value =>
  fa(Number(value || 1).toFixed(2)) + "×";

const formatMoney = value =>
  fa(Math.floor(Number(value || 0))
    .toLocaleString("en-US")
    .replaceAll(",", "٬"));

const safeText = value =>
  String(value || "").replace(/[<>&"']/g, "");

const telegramUser = tg?.initDataUnsafe?.user || {
  id: "browser-" + Math.random().toString(36).slice(2),
  first_name: "کاربر",
  username: "",
  photo_url: ""
};

const profile = {
  telegramId: String(telegramUser.id),
  name: safeText(
    [telegramUser.first_name, telegramUser.last_name]
      .filter(Boolean).join(" ")
  ).slice(0, 50) || "کاربر",
  username: safeText(telegramUser.username || "").slice(0, 40),
  photo: String(telegramUser.photo_url || "").slice(0, 500)
};

let uid = "";
let round = null;
let players = {};
let serverOffset = 0;
let animationId = 0;
let lastSecond = -1;
let leavingRef = null;

const roundRef = ref(db, `rooms/${ROOM_ID}/round`);
const playersRoot = ref(db, `rooms/${ROOM_ID}/players`);
const offsetRef = ref(db, ".info/serverTimeOffset");

function now() {
  return Date.now() + serverOffset;
}

function randomId() {
  return crypto.randomUUID?.() ||
    Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function randomCrash() {
  const u = crypto.getRandomValues(new Uint32Array(1))[0] / 4294967296;
  return Math.min(100, Math.max(
    1,
    Math.floor(Math.pow(1 - u, -1 / 1.15) * 100) / 100
  ));
}

function flightDuration(multiplier) {
  return Math.max(
    500,
    Math.log(Math.max(1, multiplier)) / 0.095 * 1000
  );
}

function multiplierAt(time) {
  if (!round || round.status !== "flying") return 1;

  const elapsed = Math.max(0, time - round.startsAt) / 1000;
  return Math.min(
    round.crashMultiplier,
    Math.exp(elapsed * 0.095)
  );
}

function myPlayer() {
  if (!round?.id || !uid) return null;
  return players[round.id]?.[uid] || null;
}

function isOwner() {
  return Boolean(round && round.ownerUid === uid);
}

function feedback(style = "light") {
  tg?.HapticFeedback?.impactOccurred?.(style);
}

function toast(message) {
  const node = $("toast");
  node.textContent = message;
  node.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => node.classList.remove("show"), 2200);
}

async function createRound() {
  const stake = readStake();
  if (!stake) return;

  feedback("medium");

  const id = randomId();
  const created = now();

  const result = await runTransaction(roundRef, current => {
    const canCreate =
      !current ||
      current.status === "idle" ||
      (
        current.status === "crashed" &&
        created - Number(current.endedAt || 0) >= NEXT_ROUND_DELAY
      );

    if (!canCreate) return;

    return {
      id,
      status: "waiting",
      ownerUid: uid,
      ownerTelegramId: profile.telegramId,
      ownerName: profile.name,
      createdAt: created,
      waitingUntil: created + WAITING_LIMIT
    };
  });

  if (!result.committed) {
    toast("یک دور فعال است");
    return;
  }

  await joinRound();
}

async function joinRound() {
  if (!round?.id || round.status !== "waiting") return;

  const stake = readStake();
  if (!stake) return;

  feedback("light");

  const playerRef = ref(
    db,
    `rooms/${ROOM_ID}/players/${round.id}/${uid}`
  );

  await runTransaction(playerRef, current => {
    if (current) return current;

    return {
      ...profile,
      uid,
      stake,
      joinedAt: now(),
      online: true,
      cashMultiplier: null,
      payout: null,
      cashedAt: null
    };
  });

  leavingRef = playerRef;
  onDisconnect(playerRef).update({online: false});
}

async function launchRound() {
  if (!round || round.status !== "waiting" || !isOwner()) return;

  const count = Object.keys(players[round.id] || {}).length;
  if (!count) {
    toast("هنوز کسی جوین نشده");
    return;
  }

  feedback("heavy");

  const startsAt = now() + 3000;
  const crashMultiplier = randomCrash();
  const crashAt = startsAt + flightDuration(crashMultiplier);

  await runTransaction(roundRef, current => {
    if (
      !current ||
      current.id !== round.id ||
      current.status !== "waiting" ||
      current.ownerUid !== uid
    ) return;

    return {
      ...current,
      status: "flying",
      startsAt,
      crashAt,
      crashMultiplier
    };
  });
}

async function cashOut() {
  const player = myPlayer();

  if (
    !round ||
    round.status !== "flying" ||
    !player ||
    player.cashMultiplier
  ) return;

  const clickTime = now();

  if (clickTime >= round.crashAt) {
    toast("موشک منفجر شد");
    return;
  }

  const currentMultiplier = Math.floor(
    multiplierAt(clickTime) * 100
  ) / 100;

  const playerRef = ref(
    db,
    `rooms/${ROOM_ID}/players/${round.id}/${uid}`
  );

  const result = await runTransaction(playerRef, current => {
    if (!current || current.cashMultiplier) return;

    return {
      ...current,
      cashMultiplier: currentMultiplier,
      payout: Math.floor(current.stake * currentMultiplier),
      cashedAt: clickTime
    };
  });

  if (result.committed) {
    feedback("medium");
    tg?.HapticFeedback?.notificationOccurred?.("success");
    toast("برداشت ثبت شد");
  }
}

async function finishRound() {
  if (!round || round.status !== "flying" || now() < round.crashAt) return;

  await runTransaction(roundRef, current => {
    if (
      !current ||
      current.id !== round.id ||
      current.status !== "flying" ||
      now() < current.crashAt
    ) return;

    return {
      ...current,
      status: "crashed",
      endedAt: current.crashAt
    };
  });
}

function readStake() {
  const normalized = $("stake").value
    .replace(/[۰-۹]/g, c => "۰۱۲۳۴۵۶۷۸۹".indexOf(c))
    .replace(/[٬,\s]/g, "");

  const stake = Number(normalized);

  if (!Number.isFinite(stake) || stake < 1 || stake > 1e9) {
    toast("مبلغ معتبر وارد کن");
    $("stake").focus();
    return null;
  }

  return Math.floor(stake);
}

function playerAvatar(player) {
  const letter = safeText(player.name?.trim()?.[0] || "؟");

  return player.photo
    ? `<img src="${safeText(player.photo)}" alt="">`
    : `<span>${letter}</span>`;
}

function renderPlayers() {
  const list = $("players");
  const entries = round?.id
    ? Object.values(players[round.id] || {})
    : [];

  $("player-count").textContent = fa(entries.length);

  if (!entries.length) {
    list.innerHTML = "";
    return;
  }

  list.innerHTML = entries
    .sort((a, b) =>
      Number(a.joinedAt || 0) - Number(b.joinedAt || 0)
    )
    .map(player => {
      const cashed = Boolean(player.cashMultiplier);
      const username = player.username
        ? `@${safeText(player.username)}`
        : safeText(player.name);

      return `
        <article class="player ${cashed ? "cashed" : ""}">
          <div class="avatar">${playerAvatar(player)}</div>
          <div class="player-info">
            <strong>${username}</strong>
            <small>
              ${
                cashed
                  ? `${formatMultiplier(player.cashMultiplier)} · ${formatMoney(player.payout)}`
                  : formatMoney(player.stake)
              }
            </small>
          </div>
          <i>${cashed ? "✓" : ""}</i>
        </article>
      `;
    }).join("");
}

function renderControls() {
  const button = $("action");
  const player = myPlayer();
  const waiting = round?.status === "waiting";
  const flying = round?.status === "flying";
  const crashed = round?.status === "crashed";
  const joined = Boolean(player);

  $("stake-wrap").classList.toggle(
    "locked",
    joined || flying || crashed
  );

  $("stake").disabled = joined || flying || crashed;

  button.disabled = false;
  button.className = "action";

  if (!round || round.status === "idle") {
    button.textContent = "ساخت دور";
    button.onclick = createRound;
    return;
  }

  if (waiting && !joined) {
    button.textContent = "پیوستن";
    button.classList.add("join");
    button.onclick = joinRound;
    return;
  }

  if (waiting && joined && isOwner()) {
    button.textContent = "پرتاب";
    button.classList.add("launch");
    button.onclick = launchRound;
    return;
  }

  if (waiting && joined) {
    button.textContent = "منتظر پرتاب";
    button.classList.add("disabled");
    button.disabled = true;
    button.onclick = null;
    return;
  }

  if (flying && joined && !player.cashMultiplier) {
    const value = Math.floor(
      player.stake * multiplierAt(now())
    );

    button.textContent = `برداشت ${formatMoney(value)}`;
    button.classList.add("cash");
    button.onclick = cashOut;
    return;
  }

  if (flying && joined && player.cashMultiplier) {
    button.textContent =
      `برداشت شد · ${formatMultiplier(player.cashMultiplier)}`;
    button.classList.add("done");
    button.disabled = true;
    button.onclick = null;
    return;
  }

  if (flying && !joined) {
    button.textContent = "پرواز شروع شده";
    button.classList.add("disabled");
    button.disabled = true;
    button.onclick = null;
    return;
  }

  if (crashed) {
    button.textContent = "انفجار";
    button.classList.add("crashed");
    button.disabled = true;
    button.onclick = null;
  }
}

function renderStatus(time) {
  const multiplierNode = $("multiplier");
  const statusNode = $("status");
  const rocket = $("rocket");

  multiplierNode.className = "multiplier";
  rocket.className = "rocket";

  if (!round || round.status === "idle") {
    multiplierNode.textContent = "۱٫۰۰×";
    statusNode.textContent = "آماده";
    return;
  }

  if (round.status === "waiting") {
    const remaining = Math.max(
      0,
      Math.ceil((round.waitingUntil - time) / 1000)
    );

    multiplierNode.textContent = fa(remaining);
    statusNode.textContent = isOwner()
      ? "بازیکن‌ها می‌توانند جوین شوند"
      : "در انتظار پرتاب";
    return;
  }

  if (round.status === "flying") {
    if (time < round.startsAt) {
      const countdown = Math.max(
        1,
        Math.ceil((round.startsAt - time) / 1000)
      );

      multiplierNode.textContent = fa(countdown);
      statusNode.textContent = "پرتاب";
      rocket.classList.add("ignite");
      return;
    }

    const value = multiplierAt(time);
    multiplierNode.textContent = formatMultiplier(value);
    statusNode.textContent = "پرواز زنده";
    rocket.classList.add("flying");

    if (time >= round.crashAt) finishRound();
    return;
  }

  if (round.status === "crashed") {
    multiplierNode.textContent =
      formatMultiplier(round.crashMultiplier);

    multiplierNode.classList.add("lost");
    statusNode.textContent = "انفجار";
    rocket.classList.add("boom");
  }
}

function render(time = now()) {
  renderStatus(time);
  renderPlayers();
  renderControls();

  cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(loop);
}

function loop() {
  const time = now();
  renderStatus(time);

  if (round?.status === "flying") {
    renderControls();
  }

  if (round?.status === "waiting") {
    const second = Math.floor((round.waitingUntil - time) / 1000);

    if (second !== lastSecond) {
      lastSecond = second;
      renderControls();
    }
  }

  animationId = requestAnimationFrame(loop);
}

onValue(offsetRef, snapshot => {
  serverOffset = Number(snapshot.val() || 0);
});

onValue(roundRef, snapshot => {
  round = snapshot.val();

  if (
    round?.status === "crashed" &&
    now() - Number(round.endedAt || 0) >= NEXT_ROUND_DELAY
  ) {
    runTransaction(roundRef, current => {
      if (
        current?.id === round.id &&
        current.status === "crashed" &&
        now() - Number(current.endedAt || 0) >= NEXT_ROUND_DELAY
      ) {
        return {status: "idle", updatedAt: now()};
      }
      return;
    });
  }

  render();
});

onValue(playersRoot, snapshot => {
  players = snapshot.val() || {};
  renderPlayers();
  renderControls();
});

$("stake").addEventListener("input", event => {
  event.target.value = event.target.value
    .replace(/[^\d۰-۹٬,]/g, "");
});

async function boot() {
  try {
    const credential = await signInAnonymously(auth);
    uid = credential.user.uid;

    $("me-name").textContent = profile.username
      ? `@${profile.username}`
      : profile.name;

    $("me-avatar").innerHTML = playerAvatar(profile);

    set(ref(db, `presence/${uid}`), {
      telegramId: profile.telegramId,
      name: profile.name,
      online: true,
      updatedAt: now()
    });

    onDisconnect(ref(db, `presence/${uid}`)).update({
      online: false,
      updatedAt: Date.now()
    });

    render();
  } catch (error) {
    console.error(error);
    $("action").textContent = "خطای اتصال";
    $("action").disabled = true;
    toast("تنظیمات Firebase را بررسی کن");
  }
}

boot();
</script>

<style>
:root{
  color-scheme:dark;
  --bg:#050713;
  --panel:#0d1424e8;
  --line:#a9c1ef22;
  --text:#f4f7ff;
  --muted:#8999b6;
  --cyan:#60eaff;
  --blue:#409cff;
  --green:#69ffc0;
  --red:#ff5e7d;
  --safe:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif
}
button,input{font:inherit}
button{color:inherit}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 20%,#46258d55,transparent 32%),
    radial-gradient(circle at 80% 65%,#124c8e55,transparent 34%),
    radial-gradient(circle at 50% 110%,#254d8055,transparent 42%)
}
body:after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.38;
  background-image:
    radial-gradient(circle,#fff 0 1px,transparent 1.4px),
    radial-gradient(circle,#8fdcff 0 1px,transparent 1.5px);
  background-position:0 0,40px 70px;
  background-size:93px 93px,137px 137px
}
.app{
  position:relative;
  z-index:1;
  width:min(100%,620px);
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
  padding:
    max(12px,env(safe-area-inset-top))
    14px
    max(12px,var(--safe));
  gap:12px
}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:44px
}
.logo{
  direction:ltr;
  display:flex;
  align-items:center;
  gap:9px;
  font:bold 15px Arial;
  letter-spacing:1px
}
.logo i{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 14px var(--green)
}
.me{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  color:#ccd7ea;
  font-size:11px
}
#me-name{
  max-width:145px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis
}
.mini-avatar,.avatar{
  overflow:hidden;
  display:grid;
  place-items:center;
  flex-shrink:0;
  border-radius:50%;
  background:linear-gradient(145deg,#603dd8,#208bd8);
  color:white;
  font-weight:bold
}
.mini-avatar{width:33px;height:33px}
.avatar{width:39px;height:39px}
.mini-avatar img,.avatar img{
  width:100%;
  height:100%;
  object-fit:cover
}
.stage{
  position:relative;
  flex:1;
  min-height:250px;
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  background:linear-gradient(180deg,#090e1a55,#06091299);
  box-shadow:inset 0 1px #fff1
}
.hud{
  position:absolute;
  z-index:3;
  top:24px;
  left:12px;
  right:12px;
  text-align:center
}
.multiplier{
  direction:ltr;
  font:bold clamp(58px,16vw,88px)/1 Arial;
  letter-spacing:-4px;
  text-shadow:0 0 38px #65e7ff55;
  font-variant-numeric:tabular-nums
}
.multiplier.lost{
  color:var(--red);
  text-shadow:0 0 40px #ff5e7d55
}
#status{
  margin-top:9px;
  color:#a8b7ce;
  font-size:11px
}
.rocket{
  position:absolute;
  z-index:2;
  left:50%;
  top:62%;
  width:58px;
  height:95px;
  transform:translate(-50%,-50%);
  transition:filter .2s
}
.rocket-body{
  position:absolute;
  inset:0 12px 19px;
  border-radius:50% 50% 24% 24%;
  transform:perspective(90px) rotateX(-7deg);
  background:linear-gradient(90deg,#53627b,#f1f7ff 45%,#667892);
  clip-path:polygon(50% 0,88% 35%,100% 85%,70% 100%,30% 100%,0 85%,12% 35%)
}
.window{
  position:absolute;
  z-index:2;
  top:25px;
  left:20px;

  height:22px;

  border-radius:50%;
  background:linear-gradient(145deg,#bffcff,#3686dc 55%,#122a55)
}
.wing{
  position:absolute;
  top:49px;
  width:20px;
  height:38px;
  background:#263853;
  border:1px solid #61dfff88
}
.wing.left{
  left:2px;
  clip-path:polygon(100% 0,100% 100%,0 88%,25% 35%)
}
.wing.right{
  right:2px;
  clip-path:polygon(0 0,0 100%,100% 88%,75% 35%)
}
.flame{
  position:absolute;
  left:22px;
  top:72px;
  width:14px;
  height:0;
  border-radius:50%;

  filter:drop-shadow(0 0 9px #55dfff);
  transition:height .25s
}
.rocket.ignite .flame{height:35px}
.rocket.flying{
  animation:fly 1.2s ease-in-out infinite alternate
}
.rocket.flying .flame{
  height:59px;
  animation:flame .1s linear infinite alternate
}
.rocket.boom{
  opacity:0;
  filter:drop-shadow(0 0 45px var(--red));
  transform:translate(-50%,-50%) scale(2.5)
}
.orbit{
  position:absolute;
  left:-20%;
  bottom:-170px;
  width:140%;
  height:300px;
  border:1px solid #65ddff25;
  border-radius:50%;
  transform:rotate(-10deg)
}
.players-box{
  position:absolute;
  z-index:4;
  left:10px;
  right:10px;
  bottom:10px
}
.players-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 5px 7px;
  color:var(--muted);
  font-size:10px
}
.players{
  display:flex;
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  direction:rtl;
  min-height:58px
}
.players::-webkit-scrollbar{display:none}
.player{
  min-width:155px;
  max-width:180px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#0b1426d9;
  backdrop-filter:blur(12px)
}
.player.cashed{
  border-color:#69ffc044;
  background:#09241fd9
}
.player-info{
  min-width:0;
  flex:1
}
.player strong,.player small{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis
}
.player strong{
  font-size:10px;
  font-weight:normal
}
.player small{
  direction:ltr;
  text-align:right;
  margin-top:5px;
  color:#8fa5c4;
  font-size:9px
}
.player.cashed small{color:var(--green)}
.player i{
  color:var(--green);
  font-style:normal
}
.controls{
  display:grid;
  grid-template-columns:.85fr 1.3fr;
  gap:10px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--panel);
  box-shadow:0 18px 60px #0007;
  backdrop-filter:blur(18px)
}
.stake{
  display:flex;
  flex-direction:column;
  gap:6px;
  min-width:0
}
.stake label{
  padding-right:4px;
  color:var(--muted);
  font-size:9px
}
.stake input{
  direction:ltr;
  width:100%;
  height:52px;
  border:1px solid var(--line);
  border-radius:13px;
  outline:0;
  padding:0 12px;
  background:#050a16;
  color:white;
  font-size:16px;
  text-align:center
}
.stake input:focus{border-color:#63e7ff88}
.stake.locked{opacity:.42}
.action{
  min-width:0;
  min-height:76px;
  border:0;
  border-radius:15px;
  cursor:pointer;
  padding:10px;
  color:#05121d;
  font-weight:bold;
  font-size:14px;
  background:linear-gradient(120deg,var(--cyan),var(--blue));
  box-shadow:0 0 28px #42bfff2c;
  transition:transform .12s,filter .2s
}
.action:active:not(:disabled){transform:scale(.97)}
.action.join{
  background:linear-gradient(120deg,#a899ff,#6b73ff)
}
.action.launch{
  background:linear-gradient(120deg,#ffd86a,#ff8f52)
}
.action.cash{
  background:linear-gradient(120deg,#83ffce,#2fd6b4)
}
.action.done{
  color:var(--green);
  background:#12372f
}
.action.crashed{
  color:#ff9cad;
  background:#391725
}
.action.disabled{
  color:#8998b0;
  background:#1b2639
}
.action:disabled{cursor:default}
.toast{
  position:fixed;
  z-index:20;
  left:50%;
  bottom:115px;
  width:max-content;
  max-width:88vw;
  padding:11px 16px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#172238f2;
  font-size:11px;
  opacity:0;
  pointer-events:none;
  transform:translate(-50%,12px);
  transition:.2s
}
.toast.show{
  opacity:1;
  transform:translate(-50%,0)
}
@keyframes fly{
  from{transform:translate(-50%,-50%) rotate(-2deg)}
  to{transform:translate(-50%,-57%) rotate(2deg)}
}
@keyframes flame{
  from{transform:scaleX(.8)}
  to{transform:scaleX(1.22)}
}
@media(max-height:650px){
  .app{gap:7px;padding-top:7px}
  .top{min-height:34px}
  .stage{min-height:190px}
  .hud{top:12px}
  .multiplier{font-size:52px}
  .rocket{top:57%;transform:translate(-50%,-50%) scale(.8)}
  .players-box{bottom:6px}
  .controls{padding:9px}
  .action{min-height:62px}
  .stake input{height:43px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<main class="app">
  <header class="top">
    <div class="logo"><i></i> ROCKET LIVE</div>

    <div class="me">
      <span id="me-name">...</span>
      <div class="mini-avatar" id="me-avatar"></div>
    </div>
  </header>

  <section class="stage">
    <div class="hud">
      <div class="multiplier" id="multiplier">۱٫۰۰×</div>
      <div id="status">آماده</div>
    </div>

    <div class="rocket" id="rocket">
      <div class="wing left"></div>
      <div class="wing right"></div>
      <div class="rocket-body"></div>
      <div class="window"></div>
      <div class="flame"></div>
    </div>

    <div class="orbit"></div>

    <div class="players-box">
      <div class="players-head">
        <span>بازیکن‌ها</span>
        <b id="player-count">۰</b>
      </div>
      <div class="players" id="players"></div>
    </div>
  </section>

  <section class="controls">
    <div class="stake" id="stake-wrap">
      <label for="stake">مبلغ</label>
      <input
        id="stake"
        type="text"
        inputmode="numeric"
        value="۱۰۰٬۰۰۰"
        maxlength="14"
        autocomplete="off">
    </div>

    <button class="action" id="action" type="button">
      اتصال…
    </button>
  </section>
</main>

<div class="toast" id="toast"></div>
</body>
</html>
